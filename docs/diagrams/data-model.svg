<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="d_crow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <marker id="d_one" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 3 2 L 3 10" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="980" height="660" rx="14" fill="#0b1220"/>

  <text x="24" y="32" font-size="15" font-weight="700" fill="#e2e8f0">Entity relationships — backend/models.py</text>
  <text x="24" y="52" font-size="11.5" fill="#94a3b8">8 tables. Crow's foot = many side. Cascade deletes shown in amber.</text>

  <!-- users -->
  <rect x="24" y="74" width="212" height="188" rx="9" fill="#1e3a5f" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.4"/>
  <rect x="24" y="74" width="212" height="28" rx="9" fill="#3b82f6" fill-opacity="0.3"/>
  <text x="38" y="93" font-size="12.5" font-weight="700" fill="#bfdbfe">users</text>
  <text x="38" y="120" font-size="10.5" fill="#fcd34d">PK  id</text>
  <text x="38" y="137" font-size="10.5" fill="#cbd5e1">role  student|faculty|admin</text>
  <text x="38" y="154" font-size="10.5" fill="#cbd5e1">username · email · password_hash</text>
  <text x="38" y="171" font-size="10.5" fill="#cbd5e1">prn_number (unique) · roll_id</text>
  <text x="38" y="188" font-size="10.5" fill="#cbd5e1">employee_id · batch · course</text>
  <text x="38" y="205" font-size="10.5" fill="#6ee7b7">password_changed · password_hint</text>
  <text x="38" y="222" font-size="10.5" fill="#6ee7b7">default_results_published</text>
  <text x="38" y="239" font-size="10.5" fill="#6ee7b7">default_show_leaderboard</text>
  <text x="38" y="256" font-size="10.5" fill="#94a3b8">is_verified · otp · otp_created_at</text>

  <!-- exam -->
  <rect x="384" y="74" width="222" height="206" rx="9" fill="#4c1d95" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1.4"/>
  <rect x="384" y="74" width="222" height="28" rx="9" fill="#8b5cf6" fill-opacity="0.3"/>
  <text x="398" y="93" font-size="12.5" font-weight="700" fill="#ddd6fe">exam</text>
  <text x="398" y="120" font-size="10.5" fill="#fcd34d">PK  id</text>
  <text x="398" y="137" font-size="10.5" fill="#fbbf24">FK  creator_id → users.id</text>
  <text x="398" y="154" font-size="10.5" fill="#cbd5e1">title · duration_minutes</text>
  <text x="398" y="171" font-size="10.5" fill="#cbd5e1">passing_score · exam_mode</text>
  <text x="398" y="188" font-size="10.5" fill="#cbd5e1">access_key · allowed_students</text>
  <text x="398" y="205" font-size="10.5" fill="#f9a8d4">proctor_settings  (JSON text)</text>
  <text x="398" y="222" font-size="10.5" fill="#6ee7b7">results_published (+_at, _by)</text>
  <text x="398" y="239" font-size="10.5" fill="#6ee7b7">show_leaderboard</text>
  <text x="398" y="256" font-size="10.5" fill="#cbd5e1">max_violations · max_tab_switches</text>
  <text x="398" y="273" font-size="10.5" fill="#94a3b8">status · force_ended · is_active</text>

  <!-- question -->
  <rect x="744" y="74" width="212" height="134" rx="9" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.4"/>
  <rect x="744" y="74" width="212" height="28" rx="9" fill="#10b981" fill-opacity="0.28"/>
  <text x="758" y="93" font-size="12.5" font-weight="700" fill="#a7f3d0">question</text>
  <text x="758" y="120" font-size="10.5" fill="#fcd34d">PK  id</text>
  <text x="758" y="137" font-size="10.5" fill="#fbbf24">FK  exam_id → exam.id</text>
  <text x="758" y="154" font-size="10.5" fill="#cbd5e1">question_text</text>
  <text x="758" y="171" font-size="10.5" fill="#cbd5e1">option_a .. option_d</text>
  <text x="758" y="188" font-size="10.5" fill="#cbd5e1">correct_answer · points</text>
  <text x="758" y="203" font-size="9.5" fill="#fbbf24">ON DELETE CASCADE</text>

  <!-- student_exam -->
  <rect x="356" y="330" width="278" height="224" rx="9" fill="#7c2d12" fill-opacity="0.3" stroke="#f97316" stroke-width="1.6"/>
  <rect x="356" y="330" width="278" height="28" rx="9" fill="#f97316" fill-opacity="0.3"/>
  <text x="370" y="349" font-size="12.5" font-weight="700" fill="#fed7aa">student_exam   ← the join table</text>
  <text x="370" y="376" font-size="10.5" fill="#fcd34d">PK  id</text>
  <text x="370" y="393" font-size="10.5" fill="#fbbf24">FK  student_id → users.id</text>
  <text x="370" y="410" font-size="10.5" fill="#fbbf24">FK  exam_id → exam.id</text>
  <text x="370" y="427" font-size="10.5" fill="#cbd5e1">started_at · submitted_at</text>
  <text x="370" y="444" font-size="10.5" fill="#cbd5e1">score · total_points · percentage</text>
  <text x="370" y="461" font-size="10.5" fill="#cbd5e1">passed · completed · status</text>
  <text x="370" y="478" font-size="10.5" fill="#f9a8d4">question_order   (JSON list)</text>
  <text x="370" y="495" font-size="10.5" fill="#f9a8d4">option_mapping   (JSON dict)</text>
  <text x="370" y="512" font-size="10.5" fill="#cbd5e1">tab_switch_count · total_violations</text>
  <text x="370" y="529" font-size="10.5" fill="#cbd5e1">no_face_count · multiple_faces_count</text>
  <text x="370" y="546" font-size="10.5" fill="#94a3b8">is_invalidated · faculty_review_note</text>

  <!-- student_answer -->
  <rect x="744" y="330" width="212" height="112" rx="9" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.4"/>
  <rect x="744" y="330" width="212" height="28" rx="9" fill="#10b981" fill-opacity="0.28"/>
  <text x="758" y="349" font-size="12.5" font-weight="700" fill="#a7f3d0">student_answer</text>
  <text x="758" y="376" font-size="10.5" fill="#fbbf24">FK  student_exam_id</text>
  <text x="758" y="393" font-size="10.5" fill="#fbbf24">FK  question_id</text>
  <text x="758" y="410" font-size="10.5" fill="#cbd5e1">selected_answer · is_correct</text>
  <text x="758" y="427" font-size="10.5" fill="#cbd5e1">points_earned · answered_at</text>

  <!-- exam_violation -->
  <rect x="24" y="330" width="272" height="128" rx="9" fill="#7f1d1d" fill-opacity="0.26" stroke="#ef4444" stroke-width="1.4"/>
  <rect x="24" y="330" width="272" height="28" rx="9" fill="#ef4444" fill-opacity="0.28"/>
  <text x="38" y="349" font-size="12.5" font-weight="700" fill="#fecaca">exam_violation</text>
  <text x="38" y="376" font-size="10.5" fill="#fbbf24">FK  student_exam_id</text>
  <text x="38" y="393" font-size="10.5" fill="#cbd5e1">violation_type · severity · message</text>
  <text x="38" y="410" font-size="10.5" fill="#cbd5e1">yaw · pitch · roll · deviation_*</text>
  <text x="38" y="427" font-size="10.5" fill="#cbd5e1">faces_detected · timestamp</text>
  <text x="38" y="446" font-size="10.5" fill="#cbd5e1">evidence_path → saved JPEG</text>

  <!-- exam_calibration -->
  <rect x="24" y="474" width="272" height="80" rx="9" fill="#164e63" fill-opacity="0.32" stroke="#06b6d4" stroke-width="1.4"/>
  <rect x="24" y="474" width="272" height="28" rx="9" fill="#06b6d4" fill-opacity="0.28"/>
  <text x="38" y="493" font-size="12.5" font-weight="700" fill="#a5f3fc">exam_calibration   1:1</text>
  <text x="38" y="520" font-size="10.5" fill="#fbbf24">FK  student_exam_id  (unique)</text>
  <text x="38" y="537" font-size="10.5" fill="#cbd5e1">baseline_yaw · baseline_pitch · roll</text>

  <!-- activity_log -->
  <rect x="24" y="570" width="272" height="72" rx="9" fill="#334155" fill-opacity="0.4" stroke="#64748b" stroke-width="1.4"/>
  <rect x="24" y="570" width="272" height="28" rx="9" fill="#64748b" fill-opacity="0.3"/>
  <text x="38" y="589" font-size="12.5" font-weight="700" fill="#e2e8f0">activity_log</text>
  <text x="38" y="616" font-size="10.5" fill="#fbbf24">FK  student_exam_id</text>
  <text x="38" y="633" font-size="10.5" fill="#cbd5e1">activity_type · description · severity</text>

  <!-- relations -->
  <path d="M 236 140 L 384 140" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="258" y="133" font-size="10" fill="#94a3b8">creates</text>

  <path d="M 606 140 L 744 140" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="632" y="133" font-size="10" fill="#94a3b8">contains</text>

  <path d="M 130 262 L 130 300 L 495 300 L 495 330" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="200" y="294" font-size="10" fill="#94a3b8">student sits</text>

  <path d="M 495 280 L 495 330" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="504" y="308" font-size="10" fill="#94a3b8">attempted by</text>

  <path d="M 634 400 L 744 400" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="652" y="393" font-size="10" fill="#fbbf24">cascade</text>

  <path d="M 356 394 L 296 394" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="304" y="387" font-size="10" fill="#fbbf24">cascade</text>

  <path d="M 356 500 L 296 500" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_one)"/>
  <text x="304" y="493" font-size="10" fill="#94a3b8">1:1</text>

  <path d="M 356 530 L 330 530 L 330 606 L 296 606" stroke="#64748b" stroke-width="1.5" fill="none" marker-start="url(#d_one)" marker-end="url(#d_crow)"/>
  <text x="336" y="576" font-size="10" fill="#fbbf24">cascade</text>

  <rect x="664" y="474" width="292" height="168" rx="9" fill="#0f172a" fill-opacity="0.5" stroke="#334155"/>
  <text x="682" y="498" font-size="11.5" font-weight="700" fill="#e2e8f0">SCHEMA NOTES</text>
  <text x="682" y="521" font-size="10.5" fill="#94a3b8">· No Alembic. Tables come from create_all();</text>
  <text x="682" y="537" font-size="10.5" fill="#94a3b8">  new columns are ALTERed in by</text>
  <text x="682" y="553" font-size="10.5" fill="#94a3b8">  ensure_user_columns() at boot.</text>
  <text x="682" y="575" font-size="10.5" fill="#94a3b8">· allowed_students is a comma string,</text>
  <text x="682" y="591" font-size="10.5" fill="#94a3b8">  not a join table — no index, no FK.</text>
  <text x="682" y="613" font-size="10.5" fill="#94a3b8">· total_violations is declared twice on</text>
  <text x="682" y="629" font-size="10.5" fill="#94a3b8">  student_exam; the later wins.</text>
</svg>
