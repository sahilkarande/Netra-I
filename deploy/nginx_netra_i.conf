# Template: deploy/deploy_nginx.sh replaces __PROJECT_DIR__ with this checkout's path.
# The app (python app.py or gunicorn) must listen on 127.0.0.1:8800.
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate __PROJECT_DIR__/certs/cert.pem;
    ssl_certificate_key __PROJECT_DIR__/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8800/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Socket.IO only accepts same-origin connections; this tells it the
        # browser is on HTTPS even though nginx talks plain HTTP to the app.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
